<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ Project BUKI - Voice Dataset Studio</title>
    <link rel="stylesheet" href="/static/curator.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="studio-container">
        <!-- Top Navigation & Stats Bar -->
        <header class="studio-header">
            <div class="header-left">
                <a href="/" class="back-link" title="메인 채팅으로 돌아가기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span>채팅 홈</span>
                </a>
                <div class="brand-title">
                    <span class="pulse-dot"></span>
                    <h1>BUKI Voice Dataset Studio</h1>
                    <span class="version-tag">v2.5 Curator</span>
                </div>
            </div>

            <!-- Live Dataset Summary Stats -->
            <div class="header-stats">
                <div class="stat-pill">
                    <span class="stat-label">총 샘플</span>
                    <span class="stat-value" id="stat-total">0개</span>
                </div>
                <div class="stat-pill highlight">
                    <span class="stat-label">학습 포함</span>
                    <span class="stat-value" id="stat-included">0개</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">총 재생시간</span>
                    <span class="stat-value" id="stat-duration">0분 0초</span>
                </div>
            </div>

            <!-- Global Actions -->
            <div class="header-actions">
                <button class="btn btn-secondary" id="btn-refresh" title="디렉토리 새로고침">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    새로고침
                </button>
                <button class="btn btn-primary" id="btn-save-all" title="단축키: Ctrl + S">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    전체 저장 (Ctrl+S)
                </button>
                <button class="btn btn-accent" id="btn-sync-gdrive" title="Google Drive rclone 백업">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>
                    G-Drive 백업
                </button>
            </div>
        </header>

        <!-- Filter & Search Toolbar -->
        <section class="toolbar-section">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="search-input" placeholder="파일명, 자막 대사, 메모 검색 (예: 114, 상상도, 잡음)">
                <button id="search-clear" class="btn-clear" style="display:none;">&times;</button>
            </div>

            <div class="filter-group">
                <select id="filter-status" class="select-box">
                    <option value="all">전체 상태 (모두 보기)</option>
                    <option value="included">포함된 샘플만 보기</option>
                    <option value="excluded">제외(누락)된 샘플만 보기</option>
                    <option value="has_notes">메모 있는 샘플만</option>
                </select>

                <select id="filter-emotion" class="select-box">
                    <option value="all">전체 감정</option>
                    <option value="neutral">평서문 / neutral</option>
                    <option value="question">의문문 / question</option>
                    <option value="tease">장난 / tease</option>
                    <option value="smug">도도 / smug</option>
                    <option value="flustered">당황 / flustered</option>
                    <option value="angry">화남 / angry</option>
                </select>

                <select id="sort-order" class="select-box">
                    <option value="num_asc">번호순 (001 → 132)</option>
                    <option value="num_desc">번호 역순 (132 → 001)</option>
                    <option value="dur_asc">길이 짧은순</option>
                    <option value="dur_desc">길이 긴순</option>
                </select>
            </div>

            <div class="batch-actions">
                <button class="btn-sm" id="btn-select-all">전체 선택</button>
                <button class="btn-sm" id="btn-deselect-all">전체 제외</button>
            </div>
        </section>

        <!-- Main Sample Cards Container -->
        <main class="sample-grid" id="sample-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>음성 데이터셋 및 캡션을 불러오는 중입니다...</p>
            </div>
        </main>
    </div>

    <!-- Floating Global Audio Player Bar -->
    <div class="global-player" id="global-player" style="display:none;">
        <div class="player-info">
            <span class="playing-badge">PLAYING</span>
            <span class="playing-title" id="player-title">shibuki_sample_001.wav</span>
            <span class="playing-time" id="player-time">0.0s / 0.0s</span>
        </div>
        <div class="player-controls">
            <button class="btn-icon" id="player-play-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <input type="range" id="player-seek" min="0" max="100" value="0" class="seek-slider">
            <button class="btn-icon" id="player-loop-btn" title="반복 재생">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
            </button>
        </div>
        <button class="btn-close" id="player-close-btn">&times;</button>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script src="/static/curator.js"></script>
</body>
</html>
